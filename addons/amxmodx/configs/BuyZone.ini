SETTING_DEFAULT_ACTIVE_COOLDOWN = 5.0 5.0
SETTING_DEFAULT_ICON_SCALE      = 0.1
SETTING_DEFAULT_ICON_ALPHA      = 90
SETTING_DEFAULT_ICON_SPRITE     = sprites/BuyZone/buyCart.spr

SETTING_BUY_LOAD                = 1             # Whether to load saved Buy Zones data of the current map
