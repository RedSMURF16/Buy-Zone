SETTING_BUY_CHECK               = 10.0          # Maximum selection distance when checking nearby buy zones
SETTING_OFFSET_BASE             = 90.0          # Default forward offset when previewing Buy Zone placement
SETTING_OFFSET                  = 42.0 900.0    # Minimum - Maximum offset from the player to the Buy Zone
SETTING_OFFSET_STEP             = 10.0          # Step size when scrolling to move Buy Zone forward/backward

SETTING_SIZE_BASE               = 32.0
