#==============================================#
  # Buy Zone by RedSMURF: Configuration file #
#==============================================#

# To add a new buy zone, follow the example below
# [Buy Zone Name]
# BUY_FLAGS                 = a - Radar           b - Icon                  c - Active Delay      d - Active Duration
# BUY_TEAM                  = 0 - None,           1 - Terrorists Only,      2 - CT Only,          3 - Both Teams
# BUY_RADAR                 = 0 - Disabled,       1 - Terrorists Only,      2 - CT Only,          3 - Both Teams
# BUY_ACTIVE_CHANCE         = Probability the zone activates each round       (0.0 = never,        1.0 = always)
# BUY_ACTIVE_DELAY          = Random delay before the zone goes active
# BUY_ACTIVE_DURATION       = How long the zone stays active
# BUY_ACTIVE_COOLDOWN       = Cooldown before the zone can reactivate

# BUY_ICON_SCALE            = Icon scale (Default = 0.1)
# BUY_ICON_ALPHA            = Icon alpha (Default = 90)
# BUY_ICON_SPRITE           = Path to the buy zone's icon sprite

[Main Settings]
SETTING_DEFAULT_FLAGS           = ab
SETTING_DEFAULT_TEAM            = 3
SETTING_DEFAULT_RADAR           = 1
SETTING_DEFAULT_ACTIVE_CHANCE   = 1.0
SETTING_DEFAULT_ACTIVE_DELAY    = 5.0 10.0
