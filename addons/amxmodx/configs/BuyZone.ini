[Main Settings]

SETTING_BUY_LOAD        = 1       # Whether to load saved Buy Zones data of the current map
SETTING_BUY_NOCLIP      = 1       # Whether to grant a temporarily noclip for players placing Buy Zones
SETTING_BUY_DEFAULT     = 1       # Whether to allow buying from default Buy Zones
SETTING_BUY_RADAR       = 1       # Controls which teams see the Buy Zone radar point, 0 - Disabled, 1 - Terrorists Only, 2 - CT Only, 3 - Both Teams
SETTING_OFFSET_BASE     = 90.0    # Default forward offset when previewing Buy Zone placement
SETTING_OFFSET_MIN      = 42.0    # Minimum offset from the player to the Buy Zon
SETTING_OFFSET_MAX      = 900.0   # Maximum offset from the player to the Buy Zon
SETTING_OFFSET_STEP     = 10.0    # Step size when scrolling to move Buy Zone forward/backward
SETTING_OFFSET_FREQ     = 0.1     # Scroll responsivness for placement offset (lower = faster)
SETTING_GHOST_FREQ      = 0.1     # Refresh rate of the ghost model (min = 0.1)
SETTING_SIZE_BASE       = 32.0
SETTING_SIZE_HEIGHT_MIN = 5.0
SETTING_SIZE_HEIGHT_MAX = 1500.0
SETTING_SIZE_WIDTH_MIN  = 5.0
SETTING_SIZE_WIDTH_MAX  = 1500.0
SETTING_SIZE_DEPTH_MIN  = 5.0
SETTING_SIZE_DEPTH_MAX  = 1500.0

SETTING_MENU_NAV        = buttons/blip1.wav
