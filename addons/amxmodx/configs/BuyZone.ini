#==============================================#
  # Buy Zone by RedSMURF: Configuration file #
#==============================================#

# To add a new buy zone, follow the example below
# [Buy Zone Name]
# BUY_FLAGS                 = a - Icon
# BUY_TEAM                  = 0 - None,           1 - Terrorists Only,      2 - CT Only,          3 - Both Teams
# BUY_RADAR                 = 0 - Disabled,       1 - Terrorists Only,      2 - CT Only,          3 - Both Teams

[Main Settings]
SETTING_DEFAULT_SPRITE_ICON     = sprites/BuyZone/buyCart.spr
SETTING_DEFAULT_FLAGS           = a
SETTING_DEFAULT_TEAM            = 3
SETTING_DEFAULT_RADAR           = 1
SETTING_DEFAULT_ICON_SCALE      = 0.1
SETTING_DEFAULT_ICON_ALPHA      = 90.0

SETTING_BUY_LOAD                = 1             # Whether to load saved Buy Zones data of the current map
SETTING_BUY_TASK                = 0.1           # Time interval in seconds to check for Buy Zones and apply their effects
SETTING_BUY_DEFAULT             = 1             # Whether to allow buying from default Buy Zones

[Default Zone]

[T Shop]
BUY_TEAM                        = 1
BUY_RADAR                       = 1

[CT Shop]
BUY_TEAM                        = 2
BUY_RADAR                       = 2
